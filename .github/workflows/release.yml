name: Release validation (foundation only; not a product release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  windows-foundation:
    name: Windows CPython 3.12 foundation validation — NOT A PRODUCT BUILD
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install the pinned lock manager
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.12.21
      - name: Sync exact locked Windows environment
        run: |
          set -euo pipefail
          uv sync --locked --all-groups
      - name: Verify wheel and license policies
        run: |
          set -euo pipefail
          uv run --locked python scripts/check_lock_policy.py
          uv run --locked python scripts/gen_license_inventory.py --check
          uv run --locked python scripts/audit_artifact.py --source-tree src/dentiva
      - name: Prove the lint gate rejects a deliberate red fixture
        run: |
          set -euo pipefail
          uv run --locked python scripts/dev_checks.py --failure-probe
      - name: Run Windows foundation tests and offscreen shell smoke
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          uv run --locked python scripts/dev_checks.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-foundation-evidence-${{ github.run_id }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Required Windows foundation gate
    if: always()
    needs: [windows-foundation]
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream Windows validation
        run: |
          set -euo pipefail
          test "${{ needs.windows-foundation.result }}" = "success"
