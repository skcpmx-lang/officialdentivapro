name: Quality

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Linux quality and headless smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install Qt headless system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install the pinned lock manager
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.12.21
      - name: Sync exact locked environment
        run: |
          set -euo pipefail
          uv sync --locked --all-groups
      - name: Prove the lint gate rejects a deliberate red fixture
        run: |
          set -euo pipefail
          uv run --locked python scripts/dev_checks.py --failure-probe
      - name: Run all quality gates
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          uv run --locked python scripts/dev_checks.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Required quality gate
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream quality job
        run: |
          set -euo pipefail
          test "${{ needs.quality.result }}" = "success"
